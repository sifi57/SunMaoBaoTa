<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12100e">
<title>营造 · 榫卯宝塔 ｜ AR 古建搭造</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- ══ camera feed (gyro mode) ══ -->
<video id="feed" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<div id="vignette"></div>

<!-- ══ UI overlay ══ -->
<div id="ui">

  <!-- ── 封面 ── -->
  <section id="cover" class="screen">
    <div class="cover-frame">
      <div class="seal">營<br>造</div>
      <div class="cover-rule"></div>
      <h1 class="cover-title"><span>榫</span><span>卯</span><span>宝</span><span>塔</span></h1>
      <p class="cover-sub">A R · 古 建 搭 造</p>
      <div class="cover-line"></div>
      <p class="cover-desc">
        依《营造法式》之制，于方寸之地<br>
        立一座八角五层楼阁式木塔。<br>
        自台基至塔刹，十九道工序，<br>
        一榫一卯，不用一钉。
      </p>
      <button id="btn-enter" class="btn-primary">
        <span class="btn-label">开 工</span>
        <span class="btn-sub" id="enter-sub">检测设备…</span>
      </button>
      <div id="cap-list" class="cap-list"></div>
    </div>
    <div class="cover-deco cd-1"></div>
    <div class="cover-deco cd-2"></div>
  </section>

  <!-- ── 载入 ── -->
  <section id="loading" class="screen hidden">
    <div class="load-wrap">
      <div class="load-ring"><div class="load-fill" id="load-fill"></div></div>
      <p class="load-label" id="load-label">起 版</p>
      <p class="load-tip" id="load-tip"></p>
    </div>
  </section>

  <!-- ── 放置引导 ── -->
  <section id="placing" class="screen hidden pointer-none">
    <div class="place-hint">
      <div class="scan-icon"><i></i><i></i><i></i></div>
      <p class="place-title" id="place-title">缓慢移动手机<br>寻找一块平地</p>
      <p class="place-sub" id="place-sub">地面、桌面、书本皆可</p>
    </div>
    <button id="btn-place" class="btn-place">落 基</button>
  </section>

  <!-- ── 主界面 HUD ── -->
  <section id="hud" class="screen hidden pointer-none">

    <!-- 顶栏 -->
    <header class="topbar">
      <div class="tb-left">
        <div class="progress-stack">
          <div class="ps-num"><b id="step-now">0</b><i>/</i><span id="step-all">19</span></div>
          <div class="ps-bar"><div class="ps-fill" id="ps-fill"></div></div>
        </div>
      </div>
      <div class="tb-title" id="hud-title">台基·须弥座</div>
      <div class="tb-right">
        <button class="icon-btn" id="btn-menu" aria-label="菜单">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </header>

    <!-- 侧栏工具 -->
    <div class="side-tools">
      <button class="tool" id="t-explode" title="拆解"><svg viewBox="0 0 24 24"><path d="M12 3v5M12 16v5M3 12h5M16 12h5"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></svg><span>拆解</span></button>
      <button class="tool" id="t-orbit" title="环视"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="4"/><circle cx="12" cy="12" r="2.5"/></svg><span>环视</span></button>
      <button class="tool" id="t-scale" title="缩放"><svg viewBox="0 0 24 24"><path d="M4 10V4h6M20 14v6h-6M4 4l7 7M20 20l-7-7"/></svg><span>缩放</span></button>
      <button class="tool" id="t-reset" title="重置"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg><span>重置</span></button>
    </div>

    <!-- 底部构件托盘 -->
    <div class="tray-wrap">
      <div class="tray-caption">
        <span class="tc-label" id="tray-label">取一件构件，安到亮起的位置</span>
      </div>
      <div class="tray" id="tray"></div>
      <div class="tray-rail"></div>
    </div>
  </section>

  <!-- ── 知识卷轴 ── -->
  <aside id="scroll-card" class="scroll hidden">
    <div class="scroll-rod top"></div>
    <div class="scroll-body">
      <div class="sc-head">
        <span class="sc-kicker" id="sc-kicker">工序 一</span>
        <h2 class="sc-title" id="sc-title">台基·须弥座</h2>
        <p class="sc-sub" id="sc-sub">夯土包石，八角须弥座</p>
      </div>
      <div class="sc-rule"><i></i><b>營造法式</b><i></i></div>
      <p class="sc-text" id="sc-text"></p>
      <div class="sc-foot">
        <button class="btn-ghost" id="sc-close">继 续 营 造</button>
      </div>
    </div>
    <div class="scroll-rod bottom"></div>
  </aside>

  <!-- ── 完工 ── -->
  <aside id="finish" class="screen hidden">
    <div class="fin-wrap">
      <div class="fin-glow"></div>
      <p class="fin-kicker">十 九 工 序 竟</p>
      <h2 class="fin-title">塔 成</h2>
      <div class="fin-stats">
        <div><b id="fin-h">0</b><span>层高（米）</span></div>
        <div><b id="fin-p">0</b><span>构件数</span></div>
        <div><b id="fin-t">0</b><span>用时</span></div>
      </div>
      <p class="fin-text">
        八角五层，楼阁式，五铺作双抄。<br>
        举折成曲，翼角起翘，塔刹擎天。<br>
        <em>不用一钉，全凭榫卯。</em>
      </p>
      <div class="fin-btns">
        <button class="btn-primary sm" id="fin-tour">巡 览</button>
        <button class="btn-ghost sm" id="fin-again">再 造</button>
      </div>
    </div>
  </aside>

  <!-- ── 菜单 ── -->
  <aside id="menu" class="sheet hidden">
    <div class="sheet-body">
      <h3 class="sheet-title">卷 目</h3>
      <button class="row" id="m-mode"><span>呈现方式</span><b id="m-mode-v">—</b></button>
      <button class="row" id="m-quality"><span>模型精度</span><b id="m-quality-v">精</b></button>
      <button class="row" id="m-sound"><span>环境音</span><b id="m-sound-v">开</b></button>
      <button class="row" id="m-struct"><span>显示内部构架</span><b id="m-struct-v">开</b></button>
      <button class="row" id="m-skip"><span>一键落成</span><b>▸</b></button>
      <button class="row" id="m-restart"><span>重新营造</span><b>▸</b></button>
      <div class="sheet-note" id="m-note"></div>
      <button class="btn-ghost wide" id="m-close">收 起</button>
    </div>
  </aside>

  <!-- ── toast ── -->
  <div id="toast" class="toast hidden"></div>

  <!-- ── 提示气泡 ── -->
  <div id="tip" class="tip hidden"></div>

</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
